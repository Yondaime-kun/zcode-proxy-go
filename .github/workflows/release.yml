name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v4.6.6)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Determine tag and release info
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]'; then
            echo "::error::Release tag must start with 'v' followed by a number (got: '$TAG')"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$TAG" | grep -qiE 'alpha|beta|rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-go:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Run Go tests
        working-directory: go
        run: go test -v ./...

      - name: Build Go cross-platform binaries
        working-directory: go
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p ../dist
          LDFLAGS="-s -w -X 'main.Version=${TAG}' -X 'github.com/yondaime-kun/zcode-proxy-go/internal/tui.version=${TAG}'"

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dist/zcode-proxy-linux-amd64 ./cmd/zcode-proxy
          cp ../dist/zcode-proxy-linux-amd64 ../dist/zcode-proxy
          tar -czf ../dist/zcode-proxy-linux-amd64.tar.gz -C ../dist zcode-proxy-linux-amd64

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o ../dist/zcode-proxy-linux-arm64 ./cmd/zcode-proxy
          tar -czf ../dist/zcode-proxy-linux-arm64.tar.gz -C ../dist zcode-proxy-linux-arm64

          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dist/zcode-proxy-windows-amd64.exe ./cmd/zcode-proxy
          cp ../dist/zcode-proxy-windows-amd64.exe ../dist/zcode-proxy.exe
          zip -j ../dist/zcode-proxy-windows-amd64.zip ../dist/zcode-proxy-windows-amd64.exe

          # macOS Apple Silicon (ARM64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o ../dist/zcode-proxy-darwin-arm64 ./cmd/zcode-proxy
          tar -czf ../dist/zcode-proxy-darwin-arm64.tar.gz -C ../dist zcode-proxy-darwin-arm64

          # macOS Intel (AMD64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o ../dist/zcode-proxy-darwin-amd64 ./cmd/zcode-proxy
          tar -czf ../dist/zcode-proxy-darwin-amd64.tar.gz -C ../dist zcode-proxy-darwin-amd64

      - name: Upload Go binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-go
          path: dist/*
          if-no-files-found: error

  build-captcha-solver:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build standalone captcha solvers
        run: |
          mkdir -p dist

          # Linux AMD64
          bun build --compile --target bun-linux-x64 scripts/solve-captcha.ts --outfile dist/zcode-captcha-solver-linux-amd64
          cp dist/zcode-captcha-solver-linux-amd64 dist/zcode-captcha-solver
          tar -czf dist/zcode-captcha-solver-linux-amd64.tar.gz -C dist zcode-captcha-solver-linux-amd64

          # Windows AMD64
          bun build --compile --target bun-windows-x64 scripts/solve-captcha.ts --outfile dist/zcode-captcha-solver-windows-amd64.exe
          cp dist/zcode-captcha-solver-windows-amd64.exe dist/zcode-captcha-solver.exe
          zip -j dist/zcode-captcha-solver-windows-amd64.zip dist/zcode-captcha-solver-windows-amd64.exe

          # macOS Apple Silicon (ARM64)
          bun build --compile --target bun-darwin-arm64 scripts/solve-captcha.ts --outfile dist/zcode-captcha-solver-darwin-arm64
          tar -czf dist/zcode-captcha-solver-darwin-arm64.tar.gz -C dist zcode-captcha-solver-darwin-arm64

          # macOS Intel (AMD64)
          bun build --compile --target bun-darwin-x64 scripts/solve-captcha.ts --outfile dist/zcode-captcha-solver-darwin-amd64
          tar -czf dist/zcode-captcha-solver-darwin-amd64.tar.gz -C dist zcode-captcha-solver-darwin-amd64

      - name: Upload captcha solver artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-captcha
          path: dist/*
          if-no-files-found: error

  release:
    needs: [detect, build-go, build-captcha-solver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tag exists on remote
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > sha256sums.txt || shasum -a 256 * > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.detect.outputs.is_prerelease }}
          files: dist/*
